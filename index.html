<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-ML-Insights - Advanced AI & Machine Learning Solutions</title>
    <style>
        :root {
            --primary-color: #2d3436;
            --secondary-color: #0984e3;
            --accent-color: #00b894;
            --text-color: #2d3436;
            --light-bg: #f5f6fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            line-height: 1.6;
            color: var(--text-color);
        }

        .hero {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            text-align: center;
            color: white;
            z-index: 1;
            max-width: 800px;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            animation: fadeInUp 1s ease;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            animation: fadeInUp 1s ease 0.2s;
            animation-fill-mode: both;
        }

        .cta-button {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--accent-color);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: transform 0.3s ease;
            animation: fadeInUp 1s ease 0.4s;
            animation-fill-mode: both;
        }

        .cta-button:hover {
            transform: translateY(-3px);
        }

        .neural-network {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            z-index: 0;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* SVG Animations */
        .network-node {
            animation: pulse 2s infinite;
        }

        .network-connection {
            animation: flow 3s infinite linear;
        }

        .background-circle {
            animation: rotate 30s infinite linear;
        }

        .neural-network:hover {
            filter: drop-shadow(0 0 10px rgba(0, 184, 148, 0.3));
            transition: filter 0.3s ease;
        }

        @keyframes pulse {
            0% { r: 5; fill-opacity: 0.8; }
            50% { r: 4; fill-opacity: 0.6; }
            100% { r: 5; fill-opacity: 0.8; }
        }

        @keyframes flow {
            0% { stroke-dashoffset: 1000; }
            100% { stroke-dashoffset: 0; }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes glow {
            0% { filter: drop-shadow(0 0 5px rgba(0, 184, 148, 0.3)); }
            50% { filter: drop-shadow(0 0 15px rgba(0, 184, 148, 0.5)); }
            100% { filter: drop-shadow(0 0 5px rgba(0, 184, 148, 0.3)); }
        }
    </style>
</head>
<body>
    <div class="hero">
        <svg class="neural-network" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
            <!-- Background Circle -->
            <circle class="background-circle" cx="500" cy="500" r="450" fill="none" stroke="white" stroke-width="2" opacity="0.1"/>
            
            <!-- Network Nodes -->
            <circle class="network-node" cx="500" cy="500" r="5" fill="white" style="animation-delay: 0s"/>
            <circle class="network-node" cx="300" cy="300" r="5" fill="white" style="animation-delay: 0.2s"/>
            <circle class="network-node" cx="700" cy="300" r="5" fill="white" style="animation-delay: 0.4s"/>
            <circle class="network-node" cx="300" cy="700" r="5" fill="white" style="animation-delay: 0.6s"/>
            <circle class="network-node" cx="700" cy="700" r="5" fill="white" style="animation-delay: 0.8s"/>
            
            <!-- Network Connections -->
            <line class="network-connection" x1="500" y1="500" x2="300" y2="300" stroke="white" stroke-width="2" style="stroke-dasharray: 1000; animation-delay: 0s"/>
            <line class="network-connection" x1="500" y1="500" x2="700" y2="300" stroke="white" stroke-width="2" style="stroke-dasharray: 1000; animation-delay: 0.2s"/>
            <line class="network-connection" x1="500" y1="500" x2="300" y2="700" stroke="white" stroke-width="2" style="stroke-dasharray: 1000; animation-delay: 0.4s"/>
            <line class="network-connection" x1="500" y1="500" x2="700" y2="700" stroke="white" stroke-width="2" style="stroke-dasharray: 1000; animation-delay: 0.6s"/>
        </svg>
        
        <div class="hero-content">
            <h1>AI-ML-Insights</h1>
            <p>Advanced AI & Machine Learning Solutions for Modern Businesses</p>
            <a href="#features" class="cta-button">Explore Features</a>
        </div>
    </div>
</body>
</html>
